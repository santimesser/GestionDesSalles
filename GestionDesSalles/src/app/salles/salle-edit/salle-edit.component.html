<h2>Modifier la salle</h2>

<form [formGroup]="salleForm" (ngSubmit)="onSubmit()">

  <mat-form-field appearance="fill">
    <mat-label>Nom de la salle</mat-label>
    <input matInput formControlName="name">
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Surface (m²)</mat-label>
    <input matInput type="number" formControlName="area">
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Nombre total de places</mat-label>
    <input matInput type="number" formControlName="total_seats">
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Nombre de places assises</mat-label>
    <input matInput type="number" formControlName="seated_places">
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Description des équipements</mat-label>
    <input matInput formControlName="equipment_description">
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Prix par jour (CHF)</mat-label>
    <input matInput type="number" formControlName="price_per_day">
  </mat-form-field>

  <!-- Disposition fixée, non affichée -->

  <button mat-raised-button color="primary" type="submit" [disabled]="salleForm.invalid">
    Enregistrer les modifications
  </button>

</form>
