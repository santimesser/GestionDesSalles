<div class="page">

  <div class="titre">

      <h1>Gestion des Salles</h1>
  </div>
  <div class="logoLeft">
      <img src="/Layer 1.png" alt="Logo">
  </div>

  <div class="logoRight">
      <img src="/Layer 1.png" alt="Logo">
  </div>

  <div class="login-container" 
>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <!-- // email   -->
          <div class="coolinput" >
              <label for="input" class="text" >Email:</label>
              <input type="email" placeholder="Email..." name="email" formControlName="email" required class="input"
               >
          </div>
          <br>
          <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
              <!-- // message d'erreur si le login est invalide   -->
              <small *ngIf="loginForm.get('email')?.hasError('required')"> L'email est obligatoire. </small>
              <small *ngIf="loginForm.get('email')?.hasError('email')"> L'email est invalide. </small>
          </div>


          <!-- // password   -->
          <label for="password"> </label>


          <div class="coolinput">
              <label for="input" class="text" >Mot de passe:</label>
              <input type="password" placeholder="Mot de passe..." name="password" formControlName="password" required
                  class="input" >
          </div>

          <br>
          <div *ngIf="loginForm.get('password')?.invalid && loginForm.get ('password')?.touched">
              <small *ngIf="loginForm.get('password')?.hasError('required')">Le mot de passe est requis.</small>
              <small *ngIf="loginForm.get('password')?.hasError('minlength')">
                  Le mot de passe doit avoir au moins 6 caractères.
              </small>
          </div>
          <br>
          <div class="button">
              <button class="log-In" type="submit" [disabled]="loginForm.invalid" 
              >Se connecter</button>
          </div>
          <br> <br>
          <!-- Google log-In -->
          <div class="google-div">
              <button (click)="loginWithGoogle()" class="google-button" id="google"
              >

                  <svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid" viewBox="0 0 256 262">
                      <path fill="#4285F4"
                          d="M255.878 133.451c0-10.734-.871-18.567-2.756-26.69H130.55v48.448h71.947c-1.45 12.04-9.283 30.172-26.69 42.356l-.244 1.622 38.755 30.023 2.685.268c24.659-22.774 38.875-56.282 38.875-96.027">
                      </path>
                      <path fill="#34A853"
                          d="M130.55 261.1c35.248 0 64.839-11.605 86.453-31.622l-41.196-31.913c-11.024 7.688-25.82 13.055-45.257 13.055-34.523 0-63.824-22.773-74.269-54.25l-1.531.13-40.298 31.187-.527 1.465C35.393 231.798 79.49 261.1 130.55 261.1">
                      </path>
                      <path fill="#FBBC05"
                          d="M56.281 156.37c-2.756-8.123-4.351-16.827-4.351-25.82 0-8.994 1.595-17.697 4.206-25.82l-.073-1.73L15.26 71.312l-1.335.635C5.077 89.644 0 109.517 0 130.55s5.077 40.905 13.925 58.602l42.356-32.782">
                      </path>
                      <path fill="#EB4335"
                          d="M130.55 50.479c24.514 0 41.05 10.589 50.479 19.438l36.844-35.974C195.245 12.91 165.798 0 130.55 0 79.49 0 35.393 29.301 13.925 71.947l42.211 32.783c10.59-31.477 39.891-54.251 74.414-54.251">
                      </path>
                  </svg>
                  Continue with Google
              </button>
          </div>

          <div class="button" id="register">
              <button (click)="goToRegister()" class="log-In" type="button"
              >
                  Creer un compte
              </button>
          </div>

      </form>

      <div class="button" id="forgot">
          <button (click)="goToForgotPassword()" class="log-In" type="button"
          >
              Mot de passe oublié ?
          </button>
      </div>

  </div>

  <div class="info" *ngIf="errorMessageBool">
      <div class="info__icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" viewBox="0 0 24 24" height="24" fill="none">
              <path fill="#393a37"
                  d="m12 1.5c-5.79844 0-10.5 4.70156-10.5 10.5 0 5.7984 4.70156 10.5 10.5 10.5 5.7984 0 10.5-4.7016 10.5-10.5 0-5.79844-4.7016-10.5-10.5-10.5zm.75 15.5625c0 .1031-.0844.1875-.1875.1875h-1.125c-.1031 0-.1875-.0844-.1875-.1875v-6.375c0-.1031.0844-.1875.1875-.1875h1.125c.1031 0 .1875.0844.1875.1875zm-.75-8.0625c-.2944-.00601-.5747-.12718-.7808-.3375-.206-.21032-.3215-.49305-.3215-.7875s.1155-.57718.3215-.7875c.2061-.21032.4864-.33149.7808-.3375.2944.00601.5747.12718.7808.3375.206.21032.3215.49305.3215.7875s-.1155.57718-.3215.7875c-.2061.21032-.4864.33149-.7808.3375z">
              </path>
          </svg>
      </div>
      <div class="info__title"> {{ errorMessage }}</div>
      <div class="info__close" (click)="closeAlert()"><svg height="20" viewBox="0 0 20 20" width="20"
              xmlns="http://www.w3.org/2000/svg">
              <path
                  d="m15.8333 5.34166-1.175-1.175-4.6583 4.65834-4.65833-4.65834-1.175 1.175 4.65833 4.65834-4.65833 4.6583 1.175 1.175 4.65833-4.6583 4.6583 4.6583 1.175-1.175-4.6583-4.6583z"
                  fill="#393a37"></path>
          </svg></div>
  </div>

</div>
