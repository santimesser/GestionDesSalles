<div class="page">



  <div class="titre">

    <h1>Gestion des Salles</h1>
  </div>
  <div class="logoLeft">
    <img src="/Layer 1.png" alt="Logo">
  </div>

  <div class="logoRight">
    <img src="/Layer 1.png" alt="Logo">
  </div>


  <div class="register-container">


    <h2>Configuration du Profil</h2>

    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">


      <div class="coolinput">
        <label for="input" class="text">Username:</label>
        <input type="username" placeholder="Username..." name="username" formControlName="username" required
          class="input">
      </div>


      <br>






      <div class="button">
        <button class="signIn" type="submit">Enregistrer</button>
      </div>

    </form>
    <br> <br>
    <div class="button">
      <button (click)="logout()" class="signIn">
        <mat-icon id="logout">logout</mat-icon>
      </button>
    </div>
  </div>


  <div class="info" *ngIf="errorMessageBool">
    <div class="info__icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" viewBox="0 0 24 24" height="24" fill="none">
        <path fill="#393a37"
          d="m12 1.5c-5.79844 0-10.5 4.70156-10.5 10.5 0 5.7984 4.70156 10.5 10.5 10.5 5.7984 0 10.5-4.7016 10.5-10.5 0-5.79844-4.7016-10.5-10.5-10.5zm.75 15.5625c0 .1031-.0844.1875-.1875.1875h-1.125c-.1031 0-.1875-.0844-.1875-.1875v-6.375c0-.1031.0844-.1875.1875-.1875h1.125c.1031 0 .1875.0844.1875.1875zm-.75-8.0625c-.2944-.00601-.5747-.12718-.7808-.3375-.206-.21032-.3215-.49305-.3215-.7875s.1155-.57718.3215-.7875c.2061-.21032.4864-.33149.7808-.3375.2944.00601.5747.12718.7808.3375.206.21032.3215.49305.3215.7875s-.1155.57718-.3215.7875c-.2061.21032-.4864.33149-.7808.3375z">
        </path>
      </svg>
    </div>
    <div class="info__title"> {{ errorMessage }}</div>
    <div class="info__close" (click)="closeAlert()"><svg height="20" viewBox="0 0 20 20" width="20"
        xmlns="http://www.w3.org/2000/svg">
        <path
          d="m15.8333 5.34166-1.175-1.175-4.6583 4.65834-4.65833-4.65834-1.175 1.175 4.65833 4.65834-4.65833 4.6583 1.175 1.175 4.65833-4.6583 4.6583 4.6583 1.175-1.175-4.6583-4.6583z"
          fill="#393a37"></path>
      </svg></div>
  </div>


</div>
