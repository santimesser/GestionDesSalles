<div class="page">
  <div class="header">
    <app-header></app-header>
  </div>

  


  <div class="historiqueListe" *ngIf="selectedComponent==true">
    <div class="button" id="register"  id="salle">
      <button (click)="ouvrirFormulaireCreation()" class="moreTransactions" type="button">
        Ajouter une salle
      </button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Nom</th>
          <th>Surface (m²)</th>
          <th>Places totales</th>
          <th>Places assises</th>
          <th>Équipements inclus</th>
          <th>Prix par jour</th>
          <th>Options supplémentaires</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let salle of getVisibleSalles()">
          <td data-label="Nom">{{ salle.name }}</td>
          <td data-label="Surface">{{ salle.area }}</td>
          <td data-label="Total personnes">{{ salle.total_seats }}</td>
          <td data-label="Personnes assis">{{ salle.seated_places }}</td>
          <td data-label="Équipements inclus">{{ salle.equipment_description }}</td>
          <td data-label="Prix">{{ salle.price_per_day }} CHF</td>
          <td data-label="Options supplémentaires">
            <ul>
              <p *ngFor="let equipId of salle.equipment_ids" data-label="Equipement">
                {{ getEquipmentName(equipId) }}
              </p>
            </ul>
          </td>
          <td id="positionButton">
            <div class="button">
              <button (click)="ouvrirFormulaireModifier(salle.uid!)" class="moreTransactions" type="button">
                Modifier
              </button>
            </div>
            <div class="button">
              <button (click)="supprimerSalle(salle.uid!)" class="moreTransactions" type="button">
                 Supprimer
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- Pagination -->
    <div class="pagination">
      <button (click)="loadPreviousPage()" [disabled]="!hasPreviousSalles()" class="pageChange">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3">
          <path d="M400-80 0-480l400-400 71 71-329 329 329 329-71 71Z" />
        </svg>
      </button>
      <button (click)="loadNextPage()" [disabled]="!hasMoreSalles()" class="pageChange">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3">
          <path d="m321-80-71-71 329-329-329-329 71-71 400 400L321-80Z" />
        </svg>
      </button>
    </div>

  </div>

  <div class="button" id="change" >

  </div>

  <div class="reservations" *ngIf="selectedComponent==false">
     <app-admin-reservations></app-admin-reservations>  
  </div>-->


  
</div>
