<h2>Liste des réservations</h2>

<!-- Filtres -->
<div class="filters">
  <label>
    Utilisateur :
    <input type="text" [(ngModel)]="filterUser" (input)="applyFilters()" placeholder="Nom d'utilisateur" />
  </label>
  <label>
    Salle :
    <input type="text" [(ngModel)]="filterRoom" (input)="applyFilters()" placeholder="Nom de la salle" />
  </label>
  <label>
    Date (aaaa-mm-jj) :
    <input type="date" [(ngModel)]="filterDate" (change)="applyFilters()" />
  </label>
  <button (click)="resetFilters()">Réinitialiser</button>
</div>

<!-- Résultats -->
<div class="reservations-container">
  <table class="table">
    <thead>
      <tr>
        <th>Utilisateur</th>
        <th>Salle</th>
        <th>Date début</th>
        <th>Date fin</th>
        <th>Disposition</th>
        <th>État</th>
        <th>Équipements</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let res of filteredReservations">
        <td>{{ res.user?.username || '–' }}</td>
        <td>{{ res.room?.name || '–' }}</td>
        <td>{{ res.startDate | date:'short' }}</td>
        <td>{{ res.endDate | date:'short' }}</td>
        <td>{{ res.disposition || '–' }}</td>
        <td>{{ res.status || '–' }}</td>
        <td>
          <ul *ngIf="res.equipment?.length; else noEquip">
            <li *ngFor="let eq of res.equipment">{{ eq.name }}</li>
          </ul>
          <ng-template #noEquip><span>–</span></ng-template>
        </td>
      </tr>
    </tbody>
  </table>
</div>
